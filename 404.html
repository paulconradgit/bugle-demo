<!doctype html>
<meta charset="utf-8">
<title>Bugle Design Build</title>
<meta name="robots" content="noindex">
<script>
// Every page of the Bugle Design Build has its own address. GitHub Pages sends unknown addresses here, so send
// them on to the build, which opens that page after the password (scripts/mk_share.py, DEEP_JS).
var l=location; l.replace('/?to='+encodeURIComponent((l.pathname.replace(/\/+$/,'')||'/')+l.search+l.hash));
</script>
